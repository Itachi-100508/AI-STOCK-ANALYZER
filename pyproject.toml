[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-analyzer"
version = "0.1.0"
description = "AI-powered trading intelligence for Indian markets"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
kite = ["kiteconnect>=5.0"]

[project.scripts]
ai-stock-analyzer = "ai_stock_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["ai_stock_analyzer*"]

[tool.setuptools.package-data]
"ai_stock_analyzer.data" = ["*.json"]
